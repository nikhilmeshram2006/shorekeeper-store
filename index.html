<!DOCTYPE html><html lang="en">
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>SHOREKEEPER</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--cd:#fff;--tx:#14182b;--mu:#6b7390;--pr:#3b5ba5;--gr:#0a8a3a;--bd:#e2e6f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1222;--cd:#171c32;--tx:#eef1fb;--mu:#98a0c0;--pr:#8aa8f0;--gr:#3ec878;--bd:#262c4a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1222;--cd:#171c32;--tx:#eef1fb;--mu:#98a0c0;--pr:#8aa8f0;--gr:#3ec878;--bd:#262c4a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Sora,system-ui,sans-serif;font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cd);z-index:30}
a{color:inherit;text-decoration:none}button{font-family:inherit;color:inherit}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--cd);border-bottom:1px solid var(--bd)}
.hd img{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd)}
.hd h1{margin:0;font-size:17px;letter-spacing:.14em;font-weight:700;color:var(--pr);flex:1}
.ib{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.ib:active{transform:scale(.88)}.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bk{font-size:22px}
#bd{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#e5173f;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
#bd.b{animation:bump .4s}@keyframes bump{50%{transform:scale(1.5)}}
.pg{animation:pin .38s cubic-bezier(.2,.8,.2,1)}@keyframes pin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
main{max-width:1000px;margin:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 0;scrollbar-width:none}
.ch{flex:none;border:1px solid var(--bd);background:var(--cd);border-radius:20px;padding:8px 14px;cursor:pointer;transition:.2s}
.ch.on{background:var(--pr);color:var(--cd);border-color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.c{display:block;background:var(--cd);border-radius:16px;overflow:hidden;animation:rise .5s both;animation-delay:calc(var(--i)*45ms);transition:transform .25s,box-shadow .25s}
.c:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(30,50,110,.18)}.c:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.im{position:relative;aspect-ratio:5/6}.im svg{width:100%;height:100%;display:block}
.rt{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.92);color:#222;border-radius:7px;padding:3px 8px;font-size:12px;font-weight:600}.rt b{color:#0a8a3a}
.ci{padding:10px 12px 14px}.ci h4{margin:0;font-size:15px}.ci p{margin:2px 0 6px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}.pr s{color:var(--mu)}.pr b{font-size:16px}.dn{color:var(--gr);font-weight:700}
.tg{display:inline-block;margin-top:7px;background:#ece8ff;color:#4b21c9;font-style:normal;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px}
.sn{height:60px;display:grid;place-items:center}.sn::after{content:"";width:24px;height:24px;border:3px solid var(--bd);border-top-color:var(--pr);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
.pp,.ct{max-width:560px;margin:auto;padding-bottom:96px}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.sl{min-width:100%;scroll-snap-align:center;aspect-ratio:5/6;overflow:hidden}.sl svg{width:100%;height:100%;display:block}
.dots{display:flex;justify-content:center;gap:6px;padding:8px}.dots i{width:7px;height:7px;border-radius:4px;background:var(--bd);transition:.3s}.dots i.on{width:20px;background:var(--pr)}
.in{padding:0 16px}.row{display:flex;justify-content:space-between;align-items:center}.row h2{margin:0;font-size:22px}
.rt2{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:4px 9px;font-weight:600}
.nm{color:var(--mu);margin:4px 0 8px}.big b{font-size:24px}.mu{color:var(--mu);font-size:12px}
h5{margin:18px 0 8px;font-size:14px}.sz{display:flex;gap:9px;flex-wrap:wrap}
.sz button{width:48px;height:42px;border-radius:10px;border:1.5px solid var(--bd);background:var(--cd);cursor:pointer;transition:.2s;font-weight:600}
.sz button.on{border-color:var(--pr);background:var(--pr);color:var(--cd);transform:translateY(-2px)}
.sp{background:var(--cd);border-radius:14px;padding:4px 14px}.sp div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}.sp div:last-child{border:0}.sp span:first-child{color:var(--mu)}.sp span:last-child{text-align:right}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:1px solid var(--bd);z-index:15;animation:up .4s}
@keyframes up{from{transform:translateY(100%)}}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s}.btn:active{transform:scale(.95)}
.o{background:var(--cd);border:1.5px solid var(--bd)}.y{background:linear-gradient(135deg,#ffe11a,#ffc700);color:#14182b}.p{background:linear-gradient(135deg,#3b5ba5,#5f84dc);color:#fff}.w{width:100%;flex:none}
.btn.pop{animation:bump .4s;background:#0a8a3a;color:#fff}
.stars{color:#f5a623;letter-spacing:2px}.stars span{opacity:.3}
.stp span{font-size:34px;color:var(--bd);cursor:pointer;transition:.15s;display:inline-block}.stp span.on{color:#f5a623;transform:scale(1.15)}
textarea,input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:12px;outline:0;transition:.2s}
textarea:focus,input:focus{border-color:var(--pr)}
.rv{background:var(--cd);border-radius:12px;padding:12px;margin:10px 0;animation:rise .4s both}.rv small{color:var(--mu)}
.ci2{display:flex;gap:12px;background:var(--cd);border-radius:14px;padding:10px;margin:10px 12px;animation:rise .45s both;animation-delay:calc(var(--i)*60ms)}
.th{width:92px;flex:none;border-radius:10px;overflow:hidden}.th svg{display:block;width:100%}.cd{flex:1;min-width:0}.cd h4{margin:0}.cd p{margin:2px 0;color:var(--mu);font-size:13px}
.qt{display:flex;align-items:center;gap:10px;margin-top:8px}.qt button{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);cursor:pointer}.qt .rm{width:auto;border:0;border-radius:6px;background:none;color:#e5173f;margin-left:auto;padding:0 6px}
.sum{background:var(--cd);border-radius:14px;padding:14px;margin:10px 12px}.sum div{display:flex;justify-content:space-between;padding:5px 0}
.tot{display:flex;flex-direction:column;flex:1}.tot s{color:var(--mu);font-size:12px}.tot b{font-size:19px}
.au{max-width:420px;margin:18px auto;padding:0 16px}.card{background:var(--cd);border-radius:18px;padding:20px}
.note{background:#e8efff;color:#223a7a;border-radius:12px;padding:11px 14px;margin-bottom:14px;animation:rise .5s both}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:600;cursor:pointer;transition:.25s}.tabs button.on{background:var(--pr);color:var(--cd)}
.card label{display:block;margin:12px 0 5px;font-weight:600}.er{color:#e5173f;min-height:20px;margin:10px 0 0;font-size:13px}.sk{animation:shk .4s}@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.av{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#3b5ba5,#8fb0f5);color:#fff;font-size:32px;display:grid;place-items:center;margin:auto;animation:pop .5s}@keyframes pop{from{transform:scale(0)}}
.em{text-align:center;padding:60px 20px;color:var(--mu)}.em .btn{margin-top:16px;max-width:240px}
.ov{position:fixed;inset:0;background:rgba(10,14,30,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fi .25s}@keyframes fi{from{opacity:0}}
.shx{background:var(--cd);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,.8,.2,1)}.shx h3{margin:0 0 10px}
.okw{text-align:center}.ok{width:90px;height:90px}.ok circle,.ok path{fill:none;stroke:#0a8a3a;stroke-width:3;stroke-linecap:round}
.ok circle{stroke-dasharray:151;stroke-dashoffset:151;animation:dr .6s forwards}.ok path{stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s .5s forwards}@keyframes dr{to{stroke-dashoffset:0}}
#ts{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#14182b;color:#fff;padding:11px 18px;border-radius:24px;opacity:0;pointer-events:none;transition:.35s;z-index:50;white-space:nowrap}
#ts.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#ts a{color:#ffd814;font-weight:700;margin-left:8px}
.spl{position:fixed;inset:0;background:var(--cd);display:grid;place-items:center;align-content:center;z-index:99;animation:fo .5s 1.3s forwards}@keyframes fo{to{opacity:0;visibility:hidden}}
.spl img{width:110px;height:110px;border-radius:50%;animation:pop .7s cubic-bezier(.3,1.5,.5,1)}.spl h1{letter-spacing:.3em;color:var(--pr);animation:rise .8s .3s both}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}

let tm=0,tp=0;const it=cart.map((c,i)=>{const p=P(c.id);tm+=p.mrp*c.q;tp+=p.price*c.q;return`<div class="ci2" style="--i:${i}"><a href="#p-${p.id}" class="th">${art(p,0)}</a><div class="cd"><h4>${p.b}</h4><p>${p.name}</p><p>Size: ${c.s} · ${p.cn}</p><div class="pr"><span class="dn">↓${p.off}%</span><s>${R(p.mrp)}</s><b>${R(p.price)}</b></div><div class="qt"><button onclick="qty(${i},-1)">−</button><span>${c.q}</span><button onclick="qty(${i},1)">+</button><button class="rm" onclick="cart.splice(${i},1);sv('sk_cart',cart);upd();cartv(1)">Remove</button></div></div></div>`}).join('');
const k=cpc&&CPN[cpc],cd=k?k[1](tp):0,tt=tp-cd;
V(`<div class="ct"><h3 style="margin:14px 14px 0">My cart (${cart.length})</h3>${it}<div class="sum"><p class="mu" style="margin:0 0 6px">have coupon code apply here</p><div style="display:flex;gap:8px"><input id="cp" value="${cpc}" placeholder="Enter coupon code" autocapitalize="characters" style="text-transform:uppercase"><button class="btn p" style="flex:none;padding:0 20px" onclick="applyCp()">Apply</button></div><p class="er" id="ce" style="margin:6px 0 0;${k?'color:var(--gr)':''}">${k?'✓ '+cpc+' applied · '+k[0]+' <a href="#cart" style="color:#e5173f;margin-left:8px" onclick="rmCp();return false">Remove</a>':''}</p></div><div class="sum"><div><span>Price</span><span>${R(tm)}</span></div><div><span>Discount</span><span style="color:var(--gr)">−${R(tm-tp)}</span></div>${cd?`<div style="color:var(--gr)"><span>Coupon discount</span><span>−${R(cd)}</span></div>`:''}<div><span>Delivery</span><span style="color:var(--gr)">Free</span></div><div><b>Total</b><b>${R(tt)}</b></div></div><div class="bar"><div class="tot"><s>${R(tm)}</s><b>${R(tt)}</b></div><button class="btn y" onclick="checkout(cart,1)">Buy</button></div></div>`,na)}
function qty(i,d){cart[i].q=Math.max(1,cart[i].q+d);sv('sk_cart',cart);upd();cartv(1)}
function modal(h){let o=$('.ov');o&&o.remove();document.body.insertAdjacentHTML('beforeend',`<div class="ov" onclick="if(event.target==this)this.remove()"><div class="shx">${h}</div></div>`)}
function checkout(items,fc){if(!user){toast('Log in to place your order');return needLogin(()=>checkout(items,fc))}
const sub=items.reduce((a,c)=>a+P(c.id).price*c.q,0),n=items.reduce((a,c)=>a+c.q,0),k=fc&&cpc&&CPN[cpc],cd=k?k[1](sub):0,tp=sub-cd;CO={items,fc,tp,n,sub,cd};
modal(`<h3>Confirm order</h3><p class="mu">${n} item(s) · Pay on delivery · Free delivery</p><textarea id="ad" rows="3" placeholder="Delivery address"></textarea><p class="er" id="ae"></p><div class="sum" style="margin:10px 0;background:var(--bg)"><div><span>Subtotal</span><span>${R(sub)}</span></div>${cd?`<div style="color:var(--gr)"><span>Coupon (${cpc})</span><span>−${R(cd)}</span></div>`:''}<div><b>Total</b><b>${R(tp)}</b></div></div><button class="btn y w" onclick="place()">Place order · ${R(tp)}</button>`)}
const CPN={SHORE10:['10% off',t=>Math.round(t*.1)],WELCOME20:['20% off, up to ₹300',t=>Math.min(300,Math.round(t*.2))],FLAT100:['₹100 off',t=>Math.min(100,t)]};
function applyCp(){const c=$('#cp').value.trim().toUpperCase();if(c&&CPN[c]){cpc=c;cartv(1);toast('Coupon applied ✓');return}cpc='';cartv(1);const e=$('#ce');$('#cp').value=c;e.textContent=c?'Invalid coupon code':'Enter a coupon code';e.classList.add('sk')}
function rmCp(){cpc='';cartv(1)}
function place(){const a=$('#ad').value.trim();if(a.length<6){const e=$('#ae');e.textContent='Enter your full delivery address';e.classList.remove('sk');void e.offsetWidth;e.classList.add('sk');return}
const id='SK'+(100000+Math.random()*899999|0);orders.unshift({id,tp:CO.tp,n:CO.n});sv('sk_ord',orders);if(CO.fc){cpc='';cart=[];sv('sk_cart',cart);upd();location.hash.slice(1)=='cart'&&cartv()}
$('.shx').innerHTML=`<div class="okw"><svg class="ok" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M14 27l8 8 16-16"/></svg><h3>Order placed!</h3><p class="mu">Order ${id} · ${R(CO.tp)}<br>It will reach ${esc(a.slice(0,40))} soon.</p><button class="btn p w" onclick="document.querySelector('.ov').remove();location.hash='#home'">Continue shopping</button></div>`}
function needLogin(cb){ret=location.hash;after=cb||null;location.hash='#profile'}
function prof(){if(user)return V(`<div class="au"><div class="card" style="text-align:center"><div class="av">${esc(user[0].toUpperCase())}</div><h3>${esc(user)}</h3><p class="mu">${orders.length} order(s) placed</p>${orders.slice(0,3).map(o=>`<div class="rv" style="text-align:left"><b>${o.id}</b><br><small>${o.n} item(s) · ${R(o.tp)}</small></div>`).join('')}<button class="btn o w" style="margin-top:10px" onclick="user=null;sv('sk_user',null);prof()">Log out</button></div></div>`);auth(users.length?'in':'up')}
function auth(m){AM=m;V(`<div class="au"><div class="note">👋 First time here? <b>Sign up first</b>, then log in with the same email and password.</div><div class="card"><div class="tabs"><button class="${m=='up'?'on':''}" onclick="auth('up')">Sign up</button><button class="${m=='in'?'on':''}" onclick="auth('in')">Log in</button></div><label>Email</label><input id="em" inputmode="email" autocapitalize="none" placeholder="name@gmail.com"><label>Password</label><input id="pw" type="password" placeholder="Letters and numbers"><p class="er" id="er"></p><button class="btn p w" style="margin-top:8px" onclick="sub()">${m=='up'?'Create account':'Log in'}</button></div></div>`,1);const v=$('#v');v.className='';void v.offsetWidth;v.className='pg'}
function sub(){const e=$('#em').value.trim().toLowerCase(),p=$('#pw').value,er=m=>{const x=$('#er');x.textContent=m;x.classList.remove('sk');void x.offsetWidth;x.classList.add('sk')};
if(e==='hello@gmail.com'&&p==='hello2006')return ok(e);
if(!/^[^\s@]+@gmail\.com$/.test(e))return er('Email must be a valid @gmail.com address');
if(!/[a-z]/i.test(p)||!/\d/.test(p))return er('Password must contain both letters and numbers');
if(AM=='up'){if(users.find(u=>u.e==e))return er('Account already exists. Please log in.');users.push({e,p});sv('sk_users',users);auth('in');$('#em').value=e;toast('Account created. Now log in')}
else{const u=users.find(u=>u.e==e);if(!u)return er('No account found. Please sign up first.');if(u.p!==p)return er('Incorrect password');ok(e)}}
function ok(e){user=e;sv('sk_user',e);toast('Welcome ✓');const r=ret,a=after;ret=after=null;if(r&&r!='#profile')location.hash=r;else prof();a&&setTimeout(a,400)}
function route(){const h=location.hash.slice(1)||'home';$('#bk').hidden=h=='home';h.startsWith('p-')?prod(+h.slice(2)):h=='cart'?cartv():h=='profile'?prof():home()}
addEventListener('hashchange',route);route();upd();
</script>
</body>
</html>
